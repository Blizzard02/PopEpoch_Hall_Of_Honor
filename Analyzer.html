var OWNED_SATURATION = 0.25;   // gold pedestal ~0.55-0.62, grey pedestal ~0.00
var MIN_MATCH = 0.8;           // below this the picture is probably not the Hall of Honor
var DOUBTFUL_DIGIT = 0.25;     // digit matches worse than this get a "please check" mark
var DIGIT_MARGIN = 0.08;       // ...and so do digits that look almost as much like another digit
var GW = 8, GH = 12;

// img = {data: RGBA array, width, height}
function rowProfile(img) {
  var p = new Float64Array(img.height), d = img.data, w = img.width;
  for (var y = 0; y < img.height; y++) {
    var s = 0, i = y * w * 4;
    for (var x = 0; x < w; x++, i += 4) s += (d[i] + d[i + 1] + d[i + 2]) / 3;
    p[y] = s / w;
  }
  return p;
}

function zscore(a) {
  var n = a.length, m = 0, v = 0, i;
  for (i = 0; i < n; i++) m += a[i];
  m /= n;
  for (i = 0; i < n; i++) v += (a[i] - m) * (a[i] - m);
  var sd = Math.sqrt(v / n) + 1e-9, out = new Float64Array(n);
  for (i = 0; i < n; i++) out[i] = (a[i] - m) / sd;
  return out;
}

// small = the screenshot scaled to 300px wide. Returns the vertical shift in 900px-wide pixels.
function findOffset(small) {
  var p = rowProfile(small), win = zscore(REF_PROFILE), best = {corr: -2, off: 0};
  for (var off = -150; off < 150; off++) {
    var s0 = 60 + off;
    if (s0 < 0 || s0 + win.length > p.length) continue;
    var seg = zscore(p.subarray(s0, s0 + win.length)), c = 0;
    for (var i = 0; i < win.length; i++) c += seg[i] * win[i];
    c /= win.length;
    if (c > best.corr) best = {corr: c, off: off};
  }
  return {offset: best.off * 3, corr: best.corr};
}

function saturation(img, cx, cy) {
  var d = img.data, w = img.width, s = 0, n = 0;
  for (var y = cy - 22; y < cy + 22; y++) for (var x = cx - 60; x < cx + 60; x++) {
    var i = (y * w + x) * 4, mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]);
    s += (mx - mn) / (mx + 1); n++;
  }
  return s / n;
}

// White digit shapes on the pedestal plaque -> list of {v: GW*GH fill grid, ar: width/height}
function glyphsFromMask(m, W, H) {
  var out = [], x = 0;
  function colHas(c) { for (var r = 0; r < H; r++) if (m[r * W + c]) return true; return false; }
  while (x < W) {
    if (!colHas(x)) { x++; continue; }
    var x0 = x;
    while (x < W && colHas(x)) x++;
    var r0 = -1, r1 = -1;
    for (var r = 0; r < H; r++) {
      for (var c = x0; c < x; c++) if (m[r * W + c]) { if (r0 < 0) r0 = r; r1 = r; break; }
    }
    if (r1 - r0 < 10) continue;
    var hh = r1 - r0 + 1, ww = x - x0, v = [];
    for (var gr = 0; gr < GH; gr++) for (var gc = 0; gc < GW; gc++) {
      var ra = Math.floor(gr * hh / GH), rb = Math.max(Math.floor((gr + 1) * hh / GH), ra + 1);
      var ca = Math.floor(gc * ww / GW), cb = Math.max(Math.floor((gc + 1) * ww / GW), ca + 1);
      var on = 0, n = 0;
      for (var yy = ra; yy < rb; yy++) for (var xx = ca; xx < cb; xx++) { on += m[(r0 + yy) * W + x0 + xx]; n++; }
      v.push(on / n);
    }
    out.push({v: v, ar: ww / hh});
  }
  return out;
}

function plaqueGlyphs(img, cx, cy) {
  var W = 70, H = 44, m = new Uint8Array(W * H), d = img.data;
  for (var r = 0; r < H; r++) for (var c = 0; c < W; c++) {
    var i = ((cy - 24 + r) * img.width + (cx - 35 + c)) * 4;
    m[r * W + c] = Math.min(d[i], d[i + 1], d[i + 2]) > 190 ? 1 : 0;
  }
  return glyphsFromMask(m, W, H);
}

function matchDigit(g, templates) {
  var best = {digit: null, score: 1e9, second: 1e9};
  for (var k in templates) {
    var t = templates[k], s = 0;
    for (var i = 0; i < t.g.length; i++) s += Math.abs(g.v[i] - t.g[i]);
    s = s / t.g.length + Math.abs(g.ar - t.ar) * 0.5;
    if (s < best.score) best = {digit: k, score: s, second: best.score};
    else if (s < best.second) best.second = s;
  }
  return best;
}

// img = screenshot at 900px wide, small = same at 300px wide, templates = digit templates
function analyzeScreenshot(img, small, templates) {
  var align = findOffset(small), results = [];
  TITLES.forEach(function (t) {
    var y = t.y + align.offset, r = {name: t.name, group: t.group, x: t.x, y: y};
    if (y - 30 < 0 || y + 30 > img.height) { r.visible = false; r.count = 0; r.doubtful = true; results.push(r); return; }
    r.visible = true;
    r.owned = saturation(img, t.x, y) > OWNED_SATURATION;
    r.count = 0; r.doubtful = false;
    if (r.owned) {
      var gs = plaqueGlyphs(img, t.x, y), digits = '';
      gs.forEach(function (g) {
        var m = matchDigit(g, templates);
        digits += m.digit;
        if (m.score > DOUBTFUL_DIGIT || m.second - m.score < DIGIT_MARGIN) r.doubtful = true;
      });
      r.count = digits ? parseInt(digits, 10) : 1;
      if (!digits) r.doubtful = true;
    }
    results.push(r);
  });
  return {ok: align.corr >= MIN_MATCH, corr: align.corr, offset: align.offset, titles: results};
}
